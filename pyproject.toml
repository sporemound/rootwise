[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "rootwise"
version = "0.23.0a0"
description = "Rootwise audit-first inventory and evidence-based storage planning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
viewer = ["PySide6==6.10.2"]
analytics = ["duckdb==1.5.5", "polars==1.43.2", "pyarrow==25.0.0"]
optimizer = ["numpy==2.4.6", "scipy==1.17.1", "pymoo==0.6.2"]
enrichment = ["blake3==1.0.9"]

[project.scripts]
rootwise = "rootwise.cli:main"
rootwise-view = "rootwise.legacy_cli:view"
rootwise-analyze = "rootwise.legacy_cli:analyze"
rootwise-rank = "rootwise.legacy_cli:rank"
rootwise-optimize = "rootwise.legacy_cli:optimize"
rootwise-enrich = "rootwise.legacy_cli:enrich"
rootwise-approve = "rootwise.legacy_cli:approve"
rootwise-preflight = "rootwise.legacy_cli:preflight"
rootwise-fuse-evidence = "rootwise.legacy_cli:fuse"
rootwise-longitudinal = "rootwise.legacy_cli:temporal"
rootwise-dependency-graph = "rootwise.legacy_cli:dependency"
rootwise-history = "rootwise.legacy_cli:history"
rootwise-synthesize-evidence = "rootwise.legacy_cli:synthesize"
rootwise-acceptance = "rootwise.legacy_cli:acceptance"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "pymoo", "pymoo.*"]
follow_imports = "skip"
ignore_missing_imports = true
