[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "paretodrive"
version = "0.8.0a0"
description = "Audit-first inventory, review analytics, and non-executing plan approval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
viewer = ["PySide6==6.10.2"]
analytics = ["duckdb==1.5.5", "polars==1.43.2", "pyarrow==25.0.0"]
optimizer = ["numpy==2.4.6", "scipy==1.17.1", "pymoo==0.6.2"]
enrichment = ["blake3==1.0.9"]

[project.scripts]
paretodrive = "paretodrive.cli:main"
paretodrive-view = "paretodrive_view.cli:main"
paretodrive-analyze = "paretodrive_analytics.cli:main"
paretodrive-rank = "paretodrive_analytics.ranking_cli:main"
paretodrive-optimize = "paretodrive_analytics.optimizer_cli:main"
paretodrive-enrich = "paretodrive_enrich.cli:main"
paretodrive-approve = "paretodrive_approval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "pymoo", "pymoo.*"]
follow_imports = "skip"
ignore_missing_imports = true
